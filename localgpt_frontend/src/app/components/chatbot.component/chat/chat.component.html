<div
    class="flex h-screen text-sm font-sans text-gray-800 bg-[#E8EDF5] p-6 rounded-lg">

    <!-- Sidebar -->
    <div
        class="w-80 flex-shrink-0 bg-white border border-gray-200 rounded-3xl shadow-lg flex flex-col">
        <!-- Sidebar header -->
        <div
            class="flex items-center justify-between px-6 py-4 border-b border-gray-200 rounded-t-3xl">
            <div class="font-bold text-lg">LocalGPT</div>
            <button
                class="bg-blue-500 hover:bg-blue-600 text-white rounded-lg p-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5"
                    fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
            </button>
        </div>

        <!-- Conversation list -->
        <div class="flex-1 overflow-auto px-6 py-4">
            <div class="text-gray-500 font-semibold flex justify-between">
                <span>Your conversations</span>
                <button class="text-blue-500 hover:underline">Clear All</button>
            </div>
            <ul class="mt-3 space-y-3">
                <li
                    *ngFor="let convo of recentConversations"
                    class="p-3 bg-gray-100 rounded-lg cursor-pointer hover:bg-gray-200">
                    💬 {{ convo }}
                </li>
            </ul>
        </div>
    </div>

    <!-- Main Chat Area -->
    <div class="flex-1 bg-white rounded-3xl shadow-lg ml-6 flex flex-col">
        <!-- Chat Header -->
        <div
            class="p-6 border-b border-gray-200 rounded-t-3xl flex justify-between items-center">
            <h1 class="text-lg font-semibold text-gray-900">{{ modelName |
                titlecase }}</h1>
        </div>

        <!-- Chat Messages -->
        <div class="flex flex-col flex-grow p-8 space-y-6 overflow-auto">
            <!-- Loop over messages -->
            <div
                *ngFor="let msg of messages"
                class="max-w-xl p-5 rounded-xl shadow-sm"
                [ngClass]="{
          'self-start bg-gray-100 text-gray-700': msg.sender === 'bot',
          'self-end bg-[#4A51FF] text-white': msg.sender === 'user'
        }">
                <p>{{ msg.text }}</p>
            </div>
        </div>

        <!-- Stop Generating Button -->
        <div *ngIf="isTyping" class="self-end">
            <button (click)="stopGenerating()" class="mt-4 bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600">
                Stop Generating
            </button>
        </div>

        <!-- Chat Input Box -->
        <div class="p-6 border-t border-gray-200 bg-white rounded-b-3xl">
            <div
                class="flex items-center bg-white border border-gray-300 rounded-full shadow-md overflow-hidden">
                <input
                    type="text"
                    [(ngModel)]="userInput"
                    (keyup.enter)="onSendMessage()"
                    placeholder="What's on your mind?..."
                    class="flex-grow px-6 py-4 outline-none focus:ring-2 focus:ring-[#4A51FF] bg-transparent">

                <button
                    (click)="onSendMessage()"
                    class="bg-[#4A51FF] text-white p-3 rounded-full flex items-center justify-center">
                    <img src="/assets/icons/send.svg" alt="Send"
                        class="w-6 h-6">
                </button>
            </div>
        </div>
    </div>
</div>

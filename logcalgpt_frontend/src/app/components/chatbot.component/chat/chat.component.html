<div class="h-screen w-screen flex flex-col bg-white">
    <!-- Chat Container -->
    <div class="flex flex-1 flex-col items-center justify-between w-full">
        <!-- Chat Messages -->
        <div class="flex-1 w-full overflow-y-auto space-y-4 p-4 scrollbar-thin scrollbar-thumb-gray-300 scrollbar-track-gray-100"
            #chatWindow>
            <div *ngFor="let message of messages" class="flex w-full">
                <!-- Message Wrapper -->
                <div [ngClass]="{
                    'justify-end': message.sender === 'User',
                    'justify-start': message.sender === 'Assistant'
                  }" class="flex w-full">
                    <!-- Message Content -->
                    <div [ngClass]="{
                      'bg-blue-500 text-white': message.sender === 'User',
                      'bg-gray-100 text-gray-800': message.sender === 'Assistant'
                    }" class="px-4 py-2 rounded-lg max-w-xs">
                        {{ message.text }}
                    </div>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="w-full flex items-center space-x-2 p-2 border-t border-gray-300">
            <!-- Resizable Input -->
            <textarea
                [(ngModel)]="question"
                (keydown)="handleKeydown($event)"
                placeholder="Type your message..."
                rows="1"
                class="flex-1 px-4 py-2 border border-gray-300 rounded-full resize-none focus:ring-2 focus:ring-blue-400 focus:outline-none"
                style="overflow-y: auto;"></textarea>
            <!-- Send/Stop Button -->
            <button *ngIf="buttonswitch; else sendButton" (click)="stopGenerating()"
                class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-full focus:outline-none">
                Stop
            </button>
            <ng-template #sendButton>
                <button (click)="handleSubmit($event)"
                    class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-full focus:outline-none">
                    Send
                </button>
            </ng-template>
        </div>
    </div>
</div>
